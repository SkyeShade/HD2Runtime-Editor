<!doctype html>
<!--
  HD2Runtime Editor UI art: every <div class="artboard"> is one exported PNG.
    data-name   file name (assets/ui/<name>.png; also images/<name>.png for data-game="raw")
    data-w/h    size in CSS pixels (export.py --scale 2 renders @2x)
    data-game   "raw": also exported at exactly 256 x 256 for the mod's images/ folder (SDK icon families)
  Open this file in a browser to design; run `py tools/ui-art/export.py` to export.
  The theme tokens below are the in-game ones (src/editor/ui/theme.lua).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>HD2Runtime Editor UI art</title>
<style>
  :root {
    --gold: #ffc72c; --gold-dim: #96710a; --gold-wash: rgba(255,199,44,.09);
    --panel: #0b0e12; --panel-alt: #0f1318; --header: #07090c; --box: #050709;
    --text: #eaeae4; --dim: #a0a4aa; --faint: #686e76; --line: rgba(255,255,255,.12);
    --mod: #68c4ff; --pending: #ff9838; --error: #ff6054; --ok: #80d694;
    --font: "FS Sinclair", "Bahnschrift", "DIN Alternate", "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #1d2127; color: var(--text); font-family: var(--font); }
  body.gallery { padding: 32px; display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start; }
  body.gallery .artboard { outline: 1px dashed rgba(255,255,255,.18); }
  body.gallery .slot { display: flex; flex-direction: column; gap: 8px; }
  body.gallery .slot > label { font: 12px var(--font); color: var(--dim); letter-spacing: .04em; }
  html.solo, body.solo { background: transparent; overflow: hidden; }
  body.solo .slot > label { display: none; }
  .artboard { position: relative; overflow: hidden; }

  /* ---- icon frame: the in-game card look (dark rounded square, yellow mark) ---- */
  .icon { width: 256px; height: 256px; display: grid; place-items: center; }
  .icon svg { width: 100%; height: 100%; }
  .icon.plate { background: var(--panel); border-radius: 44px; box-shadow: inset 0 0 0 4px rgba(255,255,255,.08); }
  .icon.plate svg { width: 70%; height: 70%; }

  /* ---- in-game icon masks (data-game="raw"): black = empty, red = the shape the overlay colours ---- */
  .mask { width: 256px; height: 256px; background: #000; display: grid; place-items: center; }
  .mask svg { width: 78%; height: 78%; }
  .mask svg * { fill: #ff0000; }

  /* ---- buttons (2x of the in-game 150 x 34) ---- */
  .btn { width: 300px; height: 68px; display: grid; place-items: center; font: 600 30px var(--font);
         letter-spacing: .06em; text-transform: uppercase; border: 2px solid var(--line); background: var(--panel); color: var(--text); }
  .btn.primary { background: var(--gold); border-color: var(--gold); color: #0e1014; }
  .btn.primary.hover { background: #ffd65c; }
  .btn.danger { color: var(--error); border-color: var(--error); }
  .btn.danger.hover { background: rgba(255,96,84,.18); }
  .btn.disabled { color: var(--faint); }

  /* ---- chips ---- */
  .chip { height: 40px; padding: 0 14px; display: inline-grid; place-items: center; font: 600 24px var(--font); letter-spacing: .05em; }
  .chip.mod { color: var(--mod); background: rgba(104,196,255,.16); }
  .chip.edited { color: var(--gold); background: var(--gold-wash); }
  .chip.pending { color: var(--pending); background: rgba(255,152,56,.18); }

  /* ---- banner ---- */
  .banner { width: 1280px; height: 400px; background:
      radial-gradient(120% 140% at 85% 0%, rgba(255,199,44,.16), transparent 55%), linear-gradient(180deg, #0d1116, #07090c);
      display: flex; align-items: center; gap: 56px; padding: 0 88px; }
  .banner .mark { width: 220px; height: 220px; flex: none; }
  .banner h1 { font: 600 76px var(--font); letter-spacing: .04em; }
  .banner h1 b { color: var(--gold); font-weight: 600; }
  .banner p { margin-top: 14px; font: 28px var(--font); color: var(--dim); max-width: 760px; line-height: 1.35; }
</style>
</head>

<script>
  // <use-mark> -> the shared mark SVG
  const mark = document.getElementById('mark').content;
  for (const el of document.querySelectorAll('use-mark')) el.replaceWith(mark.cloneNode(true));
  for (const a of document.querySelectorAll('.artboard')) { a.style.width = a.dataset.w + 'px'; a.style.height = a.dataset.h + 'px'; }
  // ?only=<name>: just that artboard at the top-left on a transparent page (what export.py captures)
  const only = new URLSearchParams(location.search).get('only');
  if (only) {
    document.documentElement.className = 'solo';
    document.body.className = 'solo';
    for (const slot of document.querySelectorAll('.slot')) {
      const a = slot.querySelector('.artboard');
      if (!a || a.dataset.name !== only) slot.remove();
    }
  }
</script>
